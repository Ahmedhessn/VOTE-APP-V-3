apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: 01061875164/redis:v1
          ports:
            - containerPort: 6379
          livenessProbe:
            exec:
              command: ["sh", "/healthcheck.sh"]
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "/healthcheck.sh"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: healthcheck
              mountPath: /healthcheck.sh
              subPath: healthcheck.sh
      volumes:
        - name: healthcheck
          configMap:
            name: redis-health


